# Blueprint pro nasazení backendu DefLearn Hubu na Render.com (návod: server/README.md).
# Render po připojení repozitáře tento soubor najde a vše nastaví sám.
services:
  - type: web
    name: jeztok-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://nadinensmark-bot.github.io
      - key: DATABASE_URL      # Postgres connection string (Neon / Render Postgres); bez něj SQLite (efemérní)
        sync: false
      - key: ANTHROPIC_API_KEY # volitelné – zapne AI dovysvětlení a generování kurzů
        sync: false
      - key: MODEL_VYSVETLI
        value: claude-opus-5-5
      - key: MODEL_KURZ
        value: claude-opus-5-5
